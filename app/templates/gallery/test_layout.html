<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布局测试</title>
    <link href="/static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 测试网格布局 */
        .test-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 24px !important;
            padding: 20px;
            border: 3px solid red;
            background: #fff0f0;
        }
        .test-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; padding: 20px;">布局测试页面</h1>
    <p style="text-align: center; color: red; font-weight: bold;">
        如果看到三个并排的彩色方块，说明三列布局正常工作！
    </p>

    <div class="test-grid">
        <div class="test-item">1</div>
        <div class="test-item">2</div>
        <div class="test-item">3</div>
        <div class="test-item">4</div>
        <div class="test-item">5</div>
        <div class="test-item">6</div>
    </div>

    <div style="text-align: center; padding: 20px;">
        <h3>诊断信息：</h3>
        <p>提交版本: <strong>95a55cb</strong></p>
        <p>预期布局: <strong>三列</strong></p>
        <p>红色边框: <strong>应该可见</strong></p>
    </div>
</body>
</html>
