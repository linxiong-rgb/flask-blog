{% extends "base.html" %}

{% block title %}创建相册 - 云相册{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-folder-plus"></i> 创建相册</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="name" class="form-label">相册名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">相册描述</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="is_public" name="is_public">
                            <label class="form-check-label" for="is_public">
                                公开相册（其他用户可以访问）
                            </label>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('gallery.index') }}" class="btn btn-secondary">取消</a>
                            <button type="submit" class="btn btn-primary">创建相册</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
