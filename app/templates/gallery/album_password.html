{% extends "gallery/base.html" %}

{% block title %}密码验证 - {{ album.name }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-lock-fill fs-1 text-primary"></i>
                        <h4 class="mt-3">相册访问受限</h4>
                        <p class="text-muted">该相册设置了访问密码，请输入密码后继续</p>
                        <h6 class="text-secondary">{{ album.name }}</h6>
                        {% if album.description %}
                        <p class="text-muted small">{{ album.description }}</p>
                        {% endif %}
                    </div>

                    <form id="passwordForm" onsubmit="return false;">
                        <div class="mb-3">
                            <label for="password" class="form-label">访问密码</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg" id="password"
                                       placeholder="请输入访问密码" required autofocus>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)">
                                    <i class="bi bi-eye-slash" id="password_icon"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback" id="passwordError"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg" id="submitBtn">
                            <i class="bi bi-unlock"></i> 验证密码
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{{ url_for('gallery.index') }}" class="text-muted">
                            <i class="bi bi-arrow-left"></i> 返回相册列表
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('passwordForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const submitBtn = document.getElementById('submitBtn');
    const passwordError = document.getElementById('passwordError');
    const passwordInput = document.getElementById('password');

    // 重置错误状态
    passwordInput.classList.remove('is-invalid');
    passwordError.textContent = '';

    // 禁用按钮
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> 验证中...';

    try {
        const response = await fetch(`/gallery/album/{{ album.id }}/verify-password`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
            },
            body: JSON.stringify({ password: password })
        });

        const data = await response.json();

        if (data.success) {
            // 密码验证成功，重新加载页面
            window.location.reload();
        } else {
            // 显示错误
            passwordInput.classList.add('is-invalid');
            passwordError.textContent = data.message || '密码错误，请重试';
        }
    } catch (error) {
        passwordInput.classList.add('is-invalid');
        passwordError.textContent = '网络错误，请重试';
    } finally {
        // 恢复按钮
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-unlock"></i> 验证密码';
    }
});

function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector('i');

    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    }
}
</script>
{% endblock %}
