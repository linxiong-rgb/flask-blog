{% extends "base.html" %}

{% block title %}访问密码 - 云相册{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header text-center">
                    <h5><i class="bi bi-lock-fill"></i> 需要密码访问</h5>
                </div>
                <div class="card-body">
                    {% if photo.thumbnail_path or photo.file_path %}
                    <div class="text-center mb-3 position-relative">
                        <img src="{{ photo.thumbnail_path or photo.file_path }}" alt="预览"
                             class="img-fluid rounded password-preview"
                             style="max-height: 200px; filter: blur(30px);">
                        <div class="preview-overlay">
                            <i class="bi bi-lock-fill" style="font-size: 2rem;"></i>
                            <p class="mb-0 mt-2">输入密码后查看</p>
                        </div>
                    </div>
                    {% endif %}
                    <p class="text-center text-muted mb-3">
                        <i class="bi bi-person"></i> {{ photo.user.username if photo.user else '用户' }} 的图片
                    </p>
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="password" class="form-label">请输入访问密码</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="输入密码" required autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-unlock"></i> 解锁查看
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.password-preview {
    transition: filter 0.3s ease;
}

.preview-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    pointer-events: none;
}

.preview-overlay i {
    display: block;
    margin-bottom: 0.5rem;
}
</style>
{% endblock %}
